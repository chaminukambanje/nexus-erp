services:
  nexus-erp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE44_APP_ID: 6a2d9d7735d1dc49c79d3f5e
        VITE_BASE44_APP_BASE_URL: https://ethereal-nexus-open-flow.base44.app
    image: nexus-erp:latest
    container_name: nexus-erp
    restart: unless-stopped
    ports:
      - "8080:80"
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
